# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/ for guidance.
# For questions or help, visit https://matrix.to/#/#12-factor-charms:ubuntu.com

name: rag-charm

type: charm

base: ubuntu@24.04

# the platforms this charm should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
platforms:
  amd64:
  # arm64:
  # ppc64el:
  # s390x:

# (Required)
summary: A Spring AI RAG chat client with a swappable LLM.

# (Required)
description: |
  A Spring Boot and Spring AI retrieval-augmented generation (RAG) app.
  It ingests web pages into OpenSearch and answers questions using any
  OpenAI-compatible LLM endpoint, such as an inference snap or Ollama.
  The model is swapped with `juju config`.

extensions:
  - spring-boot-framework

config:
  options:
    llm-base-url:
      description: Base URL of the OpenAI-compatible LLM endpoint.
      type: string
      optional: false
    llm-model:
      description: Model name sent to the LLM endpoint.
      type: string
      optional: false
    llm-max-tokens:
      description: Maximum tokens per answer.
      type: string
      default: "150"
    llm-reasoning-effort:
      description: Reasoning effort passed to the model (for example none).
      type: string
      default: none
    embedding-base-url:
      description: Base URL of the Ollama server used for embeddings.
      type: string
      optional: false
    opensearch-uri:
      description: OpenSearch URI, for example https://10.0.0.1:9200.
      type: string
      optional: false
    opensearch-username:
      description: OpenSearch username.
      type: string
      optional: false
    opensearch-password:
      description: OpenSearch password.
      type: string
      optional: false
    opensearch-ca-cert:
      description: OpenSearch CA certificate as PEM text.
      type: string
      optional: false

