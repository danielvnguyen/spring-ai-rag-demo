spring.application.name=rag-chat-client
server.port=${APP_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s

# Spring AI config
spring.ai.model.chat=openai
spring.ai.model.embedding=ollama

# OpenAI config
spring.ai.openai.base-url=${APP_LLM_BASE_URL}
spring.ai.openai.api-key=${APP_LLM_API_KEY:ignored}
spring.ai.openai.chat.options.model=${APP_LLM_MODEL}
spring.ai.openai.chat.options.temperature=${APP_LLM_TEMPERATURE:0.1}
spring.ai.openai.chat.options.max-tokens=${APP_LLM_MAX_TOKENS:150}
spring.ai.openai.chat.options.reasoning-effort=${APP_LLM_REASONING_EFFORT:none}
spring.ai.openai.chat.completions-path=${APP_LLM_COMPLETIONS_PATH:/chat/completions}

# Ollama config
spring.ai.ollama.base-url=${APP_EMBEDDING_BASE_URL}
spring.ai.ollama.embedding.options.model=${APP_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.init.timeout=5m

# Opensearch config
spring.ai.vectorstore.opensearch.uris=${APP_OPENSEARCH_URI}
spring.ai.vectorstore.opensearch.username=${APP_OPENSEARCH_USERNAME}
spring.ai.vectorstore.opensearch.password=${APP_OPENSEARCH_PASSWORD}
spring.ai.vectorstore.opensearch.index-name=${APP_OPENSEARCH_INDEX:url-docs}
spring.ai.vectorstore.opensearch.initialize-schema=true
spring.ai.vectorstore.opensearch.aws.enabled=false
spring.ai.vectorstore.opensearch.ssl-bundle=opensearch
spring.ssl.bundle.pem.opensearch.truststore.certificate=${APP_OPENSEARCH_CA_CERT}

# RAG config
app.rag.top-k=3
app.rag.ingest.batch-size=16
